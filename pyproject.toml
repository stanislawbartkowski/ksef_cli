  [build-system]                                                                                                                                                                                                                                             
  requires = ["setuptools"]                                                                                                                                                                                                                                
  build-backend = "setuptools.build_meta"                                                                                                                                                                                                                  

  [tool.setuptools.package-dir]                                                                                                                                                                                                                              
  "ksef_cli" = "ksef_cli"
                                                                                                                                                                                                                                                             
  [tool.setuptools.package-data]                                                                                                                                                                                                                           
  "ksef_cli" = ["help.txt"]                                                                                                                                                                                                                                

  [project]
  name = "ksef2.0_cli"
  version = "1.1.1"                                                                                                                                                                                                                                          
  requires-python = ">=3.10"
  authors = [                                                                                                                                                                                                                                                
    {name = "Stanisław Bartkowski", email = "stanislawbartkowski@gmail.com"},                                                                                                                                                                              
  ]                                                                                                                                                                                                                                                          
  dependencies = [
    "ksef2.0-python",                                                                                                                                                                             
    "pyyaml"                                                                                                                                                                                                                                               
  ]                                                                                                                                                                                                                                                        
  readme = "README.md" 
